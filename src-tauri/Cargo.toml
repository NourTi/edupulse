[package]
name = "edupulse-desktop"
version = "0.2.0"
description = "EduPulse local-first education management for Windows"
authors = ["EduPulse"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
