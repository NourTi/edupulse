name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python for WhatsApp sidecar
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build WhatsApp MCP sidecar
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "whatsapp-mcp"
          git clone --depth 1 https://github.com/ekaksher/whatsapp-mcp.git $source
          Push-Location $source
          git fetch --depth 1 origin 29c82d6ccfdbc9215c62b15dd4965a6674d73be9
          git checkout --detach 29c82d6ccfdbc9215c62b15dd4965a6674d73be9
          Pop-Location
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r (Join-Path $source "requirements.txt")
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Push-Location $source
          pyinstaller --onefile --name whatsapp-mcp-server --paths src --collect-all whatsapp_mcp --distpath "$env:GITHUB_WORKSPACE/src-tauri/binaries" --workpath "$env:RUNNER_TEMP/whatsapp-build" --specpath "$env:RUNNER_TEMP/whatsapp-spec" src/whatsapp_mcp/main.py
          Pop-Location

      - name: Check and test
        env:
          GOOGLE_CLIENT_ID: "000000000000-ci-validation.apps.googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "ci-only-placeholder"
        run: |
          pnpm run check
          pnpm test

      - name: Build desktop frontend
        run: pnpm run desktop:web-build

      - name: Build Windows installer
        run: pnpm run tauri:build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
